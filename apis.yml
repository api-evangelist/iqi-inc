aid: iqi-inc
name: IQI Inc (Beijing AIQI Technology)
description: >-
  IQI Inc, operating as Beijing AIQI Technology Co., Ltd. (北京爱其科技有限公司), is a
  mobile-internet company founded in April 2013 that develops smart hardware and
  robotics products under a "Create more & More fun" philosophy. It is best known
  for its ONEBOT building-block robots and construction sets — including the Mi Tu
  (米兔) block robots in the Xiaomi ecosystem and heritage-architecture sets such as
  the Millennium Mortise-and-Tenon (千年榫), Qinian Hall (祈年殿) and Forbidden City
  Corner Tower kits. The company sells through its own store, Tmall (ONEBOT flagship)
  and JD.com. It is a consumer smart-hardware/toy brand; as of this profile it
  publishes no public developer platform, API, SDK or documentation surface.
